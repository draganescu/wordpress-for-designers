name: Performance

# Measures the pull request's build and the build of its base on the same
# runner, and writes the comparison to the job summary. Fails when an
# indicator is over its budget in tests/perf/budgets.json. What is measured
# and how to read it is in docs/performance.md.

on:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: perf-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

env:
    # How many times the timing tests run on each build. The report gives
    # the median.
    ROUNDS: 3
    RESULTS: ${{ github.workspace }}/results
    PERF_APPEND: 1
    # How many times slower the page's main thread is made for the timing
    # tests. The runner is already about 1.6 times slower than a recent
    # laptop. At 4 here the frame indicators were at their worst value on
    # every run, and a board of 30 artboards came close to never finishing
    # (docs/performance.md, "Things to know").
    PERF_CPU_THROTTLE: 2

jobs:
    perf:
        name: Performance
        runs-on: ubuntu-latest
        timeout-minutes: 75
        steps:
            # The suite and its tools always come from head. Base is only
            # built and served.
            - uses: actions/checkout@v4
              with:
                  path: head

            - uses: actions/checkout@v4
              if: github.event_name == 'pull_request'
              with:
                  ref: ${{ github.event.pull_request.base.sha }}
                  path: base

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: head/package-lock.json

            - name: Build head
              working-directory: head
              run: |
                  npm ci
                  npm run build

            - name: Build base
              if: github.event_name == 'pull_request'
              working-directory: base
              run: |
                  npm ci
                  npm run build

            - name: Install Chromium
              working-directory: head
              run: npx playwright install --with-deps chromium

            # Minified WordPress scripts and the production build of React,
            # as a visitor's site would serve them.
            - name: Start WordPress for head
              working-directory: head
              run: |
                  echo '{ "config": { "SCRIPT_DEBUG": false } }' > .wp-env.override.json
                  npx wp-env start

            - name: Start WordPress for base
              if: github.event_name == 'pull_request'
              working-directory: base
              run: |
                  echo '{ "config": { "SCRIPT_DEBUG": false } }' > .wp-env.override.json
                  WP_ENV_PORT=8889 npx wp-env start

            - name: Measure the builds
              run: |
                  mkdir -p "$RESULTS"
                  node head/tools/perf-bundle.mjs head/build > "$RESULTS/head.jsonl"
                  if [ -d base ]; then
                      node head/tools/perf-bundle.mjs base/build > "$RESULTS/base.jsonl"
                  fi

            # A failure while measuring base does not fail the job: base may
            # lack what a new test needs. Its indicators are then missing
            # from the comparison.
            - name: Counts and memory
              working-directory: head
              run: |
                  if [ -d ../base ]; then
                      PERF_RESULTS="$RESULTS/base.jsonl" WP_BASE_URL=http://localhost:8889 \
                          npm run test:perf -- --grep @once || true
                  fi
                  PERF_RESULTS="$RESULTS/head.jsonl" WP_BASE_URL=http://localhost:8888 \
                      npm run test:perf -- --grep @once

            # Base and head take turns, so that a slow or fast spell of the
            # runner falls on both.
            - name: Timings
              working-directory: head
              run: |
                  for round in $(seq "$ROUNDS"); do
                      if [ -d ../base ]; then
                          PERF_RESULTS="$RESULTS/base.jsonl" WP_BASE_URL=http://localhost:8889 \
                              npm run test:perf -- --grep @timing || true
                      fi
                      PERF_RESULTS="$RESULTS/head.jsonl" WP_BASE_URL=http://localhost:8888 \
                          npm run test:perf -- --grep @timing
                  done

            - name: Report
              if: always()
              working-directory: head
              run: |
                  set +e
                  node tools/perf-report.mjs \
                      --head "$RESULTS/head.jsonl" \
                      --base "$RESULTS/base.jsonl" \
                      --budgets tests/perf/budgets.json \
                      --strict > "$RESULTS/report.md"
                  status=$?
                  cat "$RESULTS/report.md" >> "$GITHUB_STEP_SUMMARY"
                  exit $status

            - name: Upload results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: perf-results
                  path: results
                  retention-days: 30
                  if-no-files-found: ignore

            - name: WordPress debug log
              if: failure()
              working-directory: head
              run: npx wp-env run wordpress cat wp-content/debug.log || true
