name: Playground build

# Builds the plugin and publishes the installable files to the `playground`
# branch, which blueprint.json installs from.

on:
    push:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: playground-build
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci

            - run: npm run build

            - name: Assemble the plugin
              run: npm run package

            - name: Publish to the playground branch
              working-directory: dist/wordpress-for-designers
              run: |
                  git init -q -b playground
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A
                  git commit -q -m "Build of ${GITHUB_SHA}"
                  git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" playground
