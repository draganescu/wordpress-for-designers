name: Tests

# Lint, build, the end-to-end suite and the Studio adapter's tests on every
# pull request. Both suites run against wp-env (WordPress and PHP as pinned in
# .wp-env.json and adapters/studio/.wp-env.json) in Chromium.

on:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: tests-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint and build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci

            - run: npm run lint

            - run: npm run build

    e2e:
        name: End-to-end
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            # AC-PERF-03 expects the plugin folder to be named
            # wordpress-for-designers; wp-env names it after the checkout
            # folder, which is the repository name here.
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            # npm ci, the build, Chromium and wp-env start.
            - uses: ./.github/actions/site

            # Retries are on in CI (wp-scripts sets two). A test that passes on
            # a retry is reported as flaky in the summary, not as a failure.
            - name: Run the suite
              run: npm run test:e2e

            - name: Upload failure artifacts
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-artifacts
                  path: artifacts/test-results
                  retention-days: 7
                  if-no-files-found: ignore

            - name: WordPress debug log
              if: failure()
              run: npx wp-env run wordpress cat wp-content/debug.log || true

    adapter:
        name: Studio adapter
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci

            - run: npm run build

            - run: npx playwright install --with-deps chromium

            # Starts the adapter's own site on port 8889 and runs its tests.
            - name: Run the adapter's tests
              run: sh adapters/studio/test.sh

            - name: Upload failure artifacts
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: adapter-artifacts
                  path: adapters/studio/artifacts/test-results
                  retention-days: 7
                  if-no-files-found: ignore
